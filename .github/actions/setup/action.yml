name: Setup
description: Setup Node.js and install dependencies

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6.1.1

    - name: Setup Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
