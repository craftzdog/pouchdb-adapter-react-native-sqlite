pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{js,mjs,cjs,ts,mts,cts,jsx,tsx}'
      run: pnpm exec oxlint {staged_files}
    format:
      run: pnpm exec oxfmt --check --no-error-on-unmatched-pattern {staged_files}
    types:
      glob: '*.{js,mjs,cjs,ts,mts,cts,jsx,tsx}'
      run: pnpm typecheck
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: pnpm exec commitlint --edit
